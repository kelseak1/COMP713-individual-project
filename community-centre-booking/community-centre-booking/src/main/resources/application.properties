spring.application.name=community-centre-booking

# Store the H2 database in the local data folder
spring.datasource.url=jdbc:h2:file:./data/community-centre
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Update the database tables from the entity classes
spring.jpa.hibernate.ddl-auto=update

# Allow the database to be viewed in the browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console